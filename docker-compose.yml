version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podconnect-hub-ai
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./podconnect_leads.db:/app/podconnect_leads.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
